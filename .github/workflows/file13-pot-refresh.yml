name: File 13 POT Refresh
on:
  push:
    branches: [audit/file-13-source-review]
    paths: ['.github/workflows/file13-pot-refresh.yml']
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Generate exact translation catalogue
        run: python3 tools/generate-pot.py
      - name: Commit catalogue if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sabri-welcome-intro/languages/sabri-welcome-intro.pot
          if git diff --cached --quiet; then
            echo 'Catalogue already current.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'File 13 review 37: refresh Future Welcome translation catalogue'
          git push origin HEAD:audit/file-13-source-review
