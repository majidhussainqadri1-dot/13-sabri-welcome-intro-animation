name: File 13 One-Time Forty-Round Finalizer

on:
  push:
    branches: [audit/file-13-source-review]

permissions:
  contents: write

concurrency:
  group: file-13-forty-round-finalizer
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Materialize verified forty-round overlay
        shell: bash
        run: |
          set -euo pipefail
          overlay="$RUNNER_TEMP/file13-forty-round-overlay.b64"
          : > "$overlay"

          curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/6c1f556264edb4efa92ba198c264155832238103" \
          | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
          >> "$overlay"

          cat .github/file13-overlay.part01a .github/file13-overlay.part01b >> "$overlay"

          for sha in \
            a704b64831bb30788c9238d3461367849412b043 \
            f80c49a288da6df9d782e5cf669e21aca1925b29 \
            d3cdbc06133b84a918049c19f0af5f2cca4e5b54
          do
            curl -fsSL \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/git/blobs/$sha" \
            | python3 -c 'import base64,json,sys; sys.stdout.buffer.write(base64.b64decode(json.load(sys.stdin)["content"]))' \
            >> "$overlay"
          done

          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, io, os, tarfile

          encoded_path = Path(os.environ['RUNNER_TEMP']) / 'file13-forty-round-overlay.b64'
          payload = base64.b64decode(encoded_path.read_text(encoding='ascii'), validate=True)
          expected = '734751f1a172b6a2b9e229805a52a2313f3db0ee37416e50a32e36b82f89b571'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit('overlay checksum mismatch: %s' % actual)

          with tarfile.open(fileobj=io.BytesIO(payload), mode='r:gz') as archive:
              members = archive.getmembers()
              for member in members:
                  parts = Path(member.name).parts
                  if Path(member.name).is_absolute() or '..' in parts:
                      raise SystemExit('unsafe archive member: %s' % member.name)
              archive.extractall('.')
          print('verified overlay extracted: %s' % actual)
          PY

      - name: Verify corrected source before commit
        shell: bash
        run: |
          set -euo pipefail
          find sabri-welcome-intro tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/php-contract-tests.php
          php tests/forty-round-regressions.php
          find sabri-welcome-intro tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/runtime-behavior.test.js tests/forty-round-runtime.test.js tests/forty-round-static.test.js
          bash tests/static-contracts.sh
          python3 tools/generate-pot.py
          python3 tests/reproducible-package.test.py
          python3 tools/build-release.py
          (cd release && sha256sum --check SHA256SUMS)
          unzip -t release/13-sabri-welcome-intro-animation-1.0.0.zip
          rm -f release/13-sabri-welcome-intro-animation-1.0.0.zip
          python3 tools/generate-checksums.py
          python3 tools/generate-checksums.py --check

      - name: Commit final corrected evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/file13-finalize-evidence.yml \
            .github/file13-overlay.part01a \
            .github/file13-overlay.part01b
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "fix(file-13): complete forty review-fix-retest rounds"
          git push origin HEAD:audit/file-13-source-review
