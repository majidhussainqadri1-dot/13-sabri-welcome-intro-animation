name: File 13 One-Time Four-Plan Update

on:
  push:
    branches: [audit/file-13-source-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply verified overlay
        shell: bash
        run: |
          set -euo pipefail
          cat .github/file13-update.part* > /tmp/file13-overlay.b64
          base64 -d /tmp/file13-overlay.b64 > /tmp/file13-overlay.tar.gz
          echo "4c120b4ed99d85cc4fbc2ec8044f2da7c399dd6a9be6ae07ee6af783af527dd0  /tmp/file13-overlay.tar.gz" | sha256sum -c -
          tar -xzf /tmp/file13-overlay.tar.gz
          while IFS= read -r path; do
            [ -n "$path" ] && rm -f -- "$path"
          done < .github/file13-delete-list.txt
          rm -f .github/file13-update.part* .github/file13-delete-list.txt .github/workflows/file13-bootstrap-update.yml
      - name: Verify final source before commit
        shell: bash
        run: |
          set -euo pipefail
          find sabri-welcome-intro tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/php-contract-tests.php
          node --check sabri-welcome-intro/assets/js/welcome-intro.js
          node --test tests/runtime-behavior.test.js
          bash tests/static-contracts.sh
          python3 tools/generate-pot.py
          python3 tools/generate-source-checksums.py
          python3 tests/reproducible-package.test.py
          python3 tools/verify-release.py
          unzip -t release/13-sabri-welcome-intro-animation-1.1.0.zip
      - name: Commit final four-plan source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "feat(file-13): complete four-plan reviewed 1.1.0"
          git push origin HEAD:audit/file-13-source-review
