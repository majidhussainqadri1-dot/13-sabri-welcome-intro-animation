name: File 13 One-Time Four-Plan Update

on:
  push:
    branches: [audit/file-13-source-review]

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Apply verified overlay
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import base64, hashlib, os, tarfile
          chunks = sorted(Path('.github').glob('file13-update.part*'))
          encoded = ''.join(path.read_text(encoding='utf-8') for path in chunks)
          payload = base64.b64decode(encoded)
          expected = '4065eda6830bbee3b27b5a48135aa1574eb0ef7db6e3a14969918b54a1b3c408'
          actual = hashlib.sha256(payload).hexdigest()
          if actual != expected:
              raise SystemExit(f'overlay checksum mismatch: {actual}')
          archive = Path(os.environ['RUNNER_TEMP']) / 'file13-overlay.tar.gz'
          archive.write_bytes(payload)
          with tarfile.open(archive, 'r:gz') as package:
              package.extractall('.')
          for raw in Path('.github/file13-delete-list.txt').read_text(encoding='utf-8').splitlines():
              if raw.strip():
                  Path(raw.strip()).unlink(missing_ok=True)
          for path in chunks:
              path.unlink(missing_ok=True)
          Path('.github/file13-delete-list.txt').unlink(missing_ok=True)
          Path('.github/workflows/file13-bootstrap-update.yml').unlink(missing_ok=True)
          PY
      - name: Verify portable package evidence
        shell: bash
        run: |
          set -euo pipefail
          python tools/generate-pot.py
          python tools/generate-source-checksums.py
          python tests/reproducible-package.test.py
          python tools/verify-release.py
          python - <<'PY'
          from zipfile import ZipFile
          with ZipFile('release/13-sabri-welcome-intro-animation-1.1.0.zip') as z:
              assert z.testzip() is None
          print('ZIP integrity: PASS')
          PY
          if command -v node >/dev/null 2>&1; then
            node --check sabri-welcome-intro/assets/js/welcome-intro.js
            node --test tests/runtime-behavior.test.js
          fi
          bash tests/static-contracts.sh
      - name: Commit final four-plan source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "majidhussainqadri1-dot"
          git config user.email "majidhussainqadri1@gmail.com"
          git add -A
          git commit -m "feat(file-13): complete four-plan reviewed 1.1.0"
          git push origin HEAD:audit/file-13-source-review
