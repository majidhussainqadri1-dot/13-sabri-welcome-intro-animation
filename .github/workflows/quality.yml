name: File 13 Quality

on:
  push:
    branches: ["main", "file13-**", "audit/file13-**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: file13-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: PHP syntax
        run: find sabri-welcome-intro-13 tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Governed contract tests
        run: php tests/run.php
      - name: File 01 registry runtime contract regression
        run: php tests/foundation-registry-contract.php
      - name: Legacy health reporting regression
        run: php tests/health-contract.php
      - name: Fail-closed schema migration persistence regression
        run: php tests/settings-migration.php
      - name: Preview rewrite deactivation regression
        run: php tests/rewrite-lifecycle.php
      - name: File 25 visual-token contract regression
        run: php tests/visual-contract.php
      - name: JavaScript syntax
        run: node --check sabri-welcome-intro-13/assets/js/welcome-intro.js
      - name: JavaScript behavior
        run: node tests/js-behavior.test.js
      - name: Package layout check
        run: |
          test -f sabri-welcome-intro-13/sabri-welcome-intro.php
          test -f docs/TWENTY-PASS-AUDIT.md
          test -f docs/TRACEABILITY.md
      - name: Reproducible package build
        run: |
          SOURCE_DATE_EPOCH=1791172800 bash tools/build-package.sh /tmp/file13-dist-a
          SOURCE_DATE_EPOCH=1791172800 bash tools/build-package.sh /tmp/file13-dist-b
          cmp /tmp/file13-dist-a/sabri-welcome-intro-13-1.0.1.zip /tmp/file13-dist-b/sabri-welcome-intro-13-1.0.1.zip
          unzip -l /tmp/file13-dist-a/sabri-welcome-intro-13-1.0.1.zip | grep 'sabri-welcome-intro-13/sabri-welcome-intro.php'
      - name: Package symlink and checksum portability regression
        run: bash tests/package-integrity.sh
      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: sabri-welcome-intro-13-php-${{ matrix.php }}
          path: |
            /tmp/file13-dist-a/sabri-welcome-intro-13-1.0.1.zip
            /tmp/file13-dist-a/sabri-welcome-intro-13-1.0.1.zip.sha256
          if-no-files-found: error
