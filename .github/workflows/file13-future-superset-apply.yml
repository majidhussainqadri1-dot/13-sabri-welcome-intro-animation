name: File 13 Future Superset Atomic Apply
on:
  push:
    branches: [audit/file-13-source-review]
    paths:
      - '.github/workflows/file13-future-superset-apply.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Reconstruct approved Future Superset payload
        run: |
          printf '%s  %s\n' \
            e3a31ce5215c77c02b531b4eb36eccbec8ac2c6fa69e3a058f0673a9ce6f8284 .github/file13-future.part00a \
            1e7f2095fd8298d51e0ef047cdcbabc945d6a2e28a6bbd54cdbe9a4f1724eb29 .github/file13-future.part00b \
            982def5f248fc5ed72d52a1a8c54328d37de0758b3e54119290a818e0208f61e .github/file13-future.part00c \
            8886a542d90dbeef4bdd5ea2a7b456911dfef86b5c5f6d4c25b29fb9eea665c3 .github/file13-future.part00d \
            f97d00ff191e936417baf5efa82cc145060329a89b8613f105fa9dcf9d6edecf .github/file13-future.part01 \
            5eae82944776e9e9c763d4ca0b33ab8b978d702f64524ee1237ec03f157cb760 .github/file13-future.part02a \
            5b9b64b9e883f553663988ab0b0d01247013a8272895cb2f46ae82a0ef722040 .github/file13-future.part02b \
            4da708c1079801ca169f24007448e1e2c6667f1a00d65fc6ac2880973e8236d9 .github/file13-future.part02c \
            b6ef43e9379ad27179bccdbe53a62be26e9fc23388c0f53e3e116a51d25fbeda .github/file13-future.part02d \
            48ac81d375394dc8dc70c6d6750cfbdc8b9c6b75fc3948b536efa60bbd6f9a87 .github/file13-future.part03 \
            23ce878cafe5a87b2b7ef66da5772cb101b3983404f451739b7cdc93991a5d68 .github/file13-future.part04 | sha256sum --check
          cat \
            .github/file13-future.part00a .github/file13-future.part00b .github/file13-future.part00c .github/file13-future.part00d \
            .github/file13-future.part01 \
            .github/file13-future.part02a .github/file13-future.part02b .github/file13-future.part02c .github/file13-future.part02d \
            .github/file13-future.part03 .github/file13-future.part04 > /tmp/file13-future.b64
          test "$(wc -c < /tmp/file13-future.b64)" -eq 81432
          printf '%s  %s\n' 0c1f5d8c07d53439aafed5087f65223270405aa9b48136bff43fee90f0cdd1d8 /tmp/file13-future.b64 | sha256sum --check
          base64 -d /tmp/file13-future.b64 > /tmp/file13-future.tar.gz
          gzip -t /tmp/file13-future.tar.gz
          tar -xzf /tmp/file13-future.tar.gz -C "$GITHUB_WORKSPACE"
          rm -f .github/file13-future.part*
          rm -f .github/workflows/file13-future-superset-apply.yml
      - name: Align inherited runtime harness with v1.1 semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/runtime-behavior.test.js'); s=p.read_text()
          s=s.replace("    fetch(url, init) { fetches.push({ url, init }); return Promise.resolve({ ok: true }); },\n    crypto:", "    addEventListener() {}, removeEventListener() {},\n    fetch(url, init) { fetches.push({ url, init }); return Promise.resolve({ ok: true }); },\n    crypto:", 1)
          s=s.replace("const r=run(); r.cont.dispatch('click'); assert.ok(Number(r.localStorage.values.get('swi_seen_at_v1'))>0);", "const r=run({accountAuthoritative:'0',userId:'0'}); r.cont.dispatch('click'); assert.ok(Number(r.localStorage.values.get('swi_seen_at_v1'))>0);", 1)
          s=s.replace("r.intro.classList.contains('swi-reduced-motion')", "r.intro.classList.contains('swi-variant-static')", 1)
          p.write_text(s)
          p=Path('tests/forty-round-runtime.test.js'); s=p.read_text()
          s=s.replace("    fetch(url, init) { fetches.push({ url, init }); return Promise.resolve({ ok: true }); },\n    crypto:", "    addEventListener() {}, removeEventListener() {},\n    fetch(url, init) { fetches.push({ url, init }); return Promise.resolve({ ok: true }); },\n    crypto:", 1)
          s=s.replace("  assert.equal(r.fetches.length, 1);\n  assert.equal(r.fetches[0].url.endsWith('/event'), true);\n  assert.equal(r.fetches[0].init.headers['X-WP-Nonce'], 'rest');\n  assert.equal(r.fetches[0].init.headers['X-SWI-Nonce'], 'event');", "  const eventRequests = r.fetches.filter((request) => request.url.endsWith('/event'));\n  assert.ok(eventRequests.length >= 1);\n  assert.equal(eventRequests[0].init.headers['X-WP-Nonce'], 'rest');\n  assert.equal(eventRequests[0].init.headers['X-SWI-Nonce'], 'event');", 1)
          p.write_text(s)
          PY
      - name: PHP syntax and contract suites
        run: |
          find sabri-welcome-intro tests -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l
          php tests/php-contract-tests.php
          php tests/forty-round-regressions.php
          php tests/governance-monotonic-regressions.php
          php tests/future-superset-regressions.php
      - name: JavaScript syntax and runtime suites
        run: |
          find sabri-welcome-intro tests -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
          node --test tests/runtime-behavior.test.js tests/forty-round-runtime.test.js tests/forty-round-static.test.js tests/future-superset-runtime.test.js
      - name: Security privacy and architecture static contracts
        run: bash tests/static-contracts.sh
      - name: Translation and visual baseline verification
        run: |
          python3 tools/generate-pot.py
          python3 tools/generate-visual-baseline.py --check
      - name: Reproducible package verification
        run: |
          python3 tests/reproducible-package.test.py
          python3 tools/build-release.py
          (cd release && sha256sum --check SHA256SUMS)
          unzip -t release/13-sabri-welcome-intro-animation-1.1.0.zip
      - name: Source and evidence checksum verification
        run: python3 tools/generate-checksums.py --check
      - name: Commit governed Future Superset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'File 13: implement approved Future Welcome Experience Superset 18'
          git push origin HEAD:audit/file-13-source-review
