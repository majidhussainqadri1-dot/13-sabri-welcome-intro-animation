name: Corrective Integrity

on:
  pull_request:
  push:
    branches:
      - audit/file-13-source-review

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Check JavaScript syntax
        run: |
          find sabri-welcome-intro -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          find tests -type f -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run deterministic JavaScript behavior and contract tests
        run: node --test tests/*.test.js

      - name: Lint and smoke-test PHP on runner
        run: |
          find sabri-welcome-intro -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -d zend.assertions=1 -d assert.exception=1 tests/php-load-smoke.php

      - name: Verify declared PHP 7.4 compatibility
        run: |
          docker run --rm -v "$PWD:/workspace" -w /workspace php:7.4-cli sh -lc "find sabri-welcome-intro -type f -name '*.php' -print0 | xargs -0 -n1 php -l && php -d zend.assertions=1 -d assert.exception=1 tests/php-load-smoke.php"

      - name: Run static security invariants
        run: bash tests/static-security.sh

      - name: Verify reproducible package
        run: |
          python3 tests/reproducible-package.test.py
          python3 tools/build-release.py
          (cd release && sha256sum --check SHA256SUMS)
          unzip -t release/13-sabri-welcome-intro-animation-0.2.0.zip

      - name: Verify committed corrected source checksums
        run: sha256sum --check CHECKSUMS-CORRECTED.sha256
