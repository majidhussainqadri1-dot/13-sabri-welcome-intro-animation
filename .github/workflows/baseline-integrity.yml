name: Baseline Integrity

on:
  push:
    branches:
      - baseline/file-13-original-import
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'baseline/file-13-original-import' || github.ref_name == 'baseline/file-13-original-import'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify recorded baseline source checksums
        run: sha256sum --check CHECKSUMS.sha256

      - name: Lint baseline PHP files
        run: find sabri-welcome-intro -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Check baseline JavaScript syntax
        run: find sabri-welcome-intro -type f -name '*.js' -print0 | sort -z | xargs -0 -n1 node --check
